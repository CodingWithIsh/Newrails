[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "plumbing"
version = "0.1.0"
description = "New rails, old margins? The cost, speed and risk of sending £200 home through banks, XRP and stablecoins."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Ismail Yusuf" }]
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "requests>=2.32",
    "pydantic>=2.7",
    "pyarrow>=16",
    "openpyxl>=3.1",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests",
    "types-PyYAML",
    "nbformat",
    "nbconvert",
    "ipykernel",
]

[project.scripts]
plumbing = "plumbing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["plumbing"]
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
